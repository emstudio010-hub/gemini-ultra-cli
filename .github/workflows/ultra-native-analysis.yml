name: Ultra native static analysis

on:
  push:
    branches: ['codex/ultra-agent-native-analysis']
    paths:
      - '.github/workflows/ultra-native-analysis.yml'
      - 'scripts/verify-ultra-native-analysis.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_RUN: '42868353559'
      PACKAGE_SOURCE: 'eace895008859c4787ffa6033557c1e951db9dce'
      PACKAGE_VERSION: '1.0.0-preview.28'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm existing package source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > "$RUNNER_TEMP/package-run.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/package-run.json")); assert.equal(r.head_sha,process.env.PACKAGE_SOURCE); assert.equal(r.status,"completed"); assert.equal(r.conclusion,"success");'
      - uses: actions/download-artifact@v4
        with:
          name: gemini-ultra-cli-${{ matrix.os }}
          run-id: ${{ env.PACKAGE_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Install pinned native radare2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radare2-release"
          if [ "$RUNNER_OS" = Linux ]; then
            test "$(uname -m)" = x86_64
            archive=radare2_6.2.2_amd64.deb
            checksum=09234e4139bf8dfcbb7fc1fdb2519859ad516e63c19d3c27d92aaecdf463b1ad
          else
            test "$(uname -m)" = arm64
            archive=radare2-arm64-6.2.2.pkg
            checksum=6d674844aacb3c72de0fd1e01353d6dd03d4235a3629b607d1fe74c98e2a5f24
          fi
          gh release download 6.2.2 --repo radareorg/radare2 --pattern "$archive" --dir "$RUNNER_TEMP/radare2-release"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/radare2-release/$archive" | shasum -a 256 -c -
          if [ "$RUNNER_OS" = Linux ]; then
            sudo dpkg -i "$RUNNER_TEMP/radare2-release/$archive"
          else
            sudo installer -pkg "$RUNNER_TEMP/radare2-release/$archive" -target /
          fi
          command -v r2
          r2 -v
      - name: Inspect installed CLI with native r2
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 -c "gemini-ultra-cli-$PACKAGE_VERSION.tgz.sha256"
          archive="$GITHUB_WORKSPACE/release/gemini-ultra-cli-$PACKAGE_VERSION.tgz"
          package_hash=$(shasum -a 256 "$archive" | awk '{print $1}')
          cd "$GITHUB_WORKSPACE"
          npm install --prefix "$RUNNER_TEMP/ultra-native" --ignore-scripts --no-audit --no-fund "$archive"
          entry="$RUNNER_TEMP/ultra-native/node_modules/gemini-ultra-cli/bundle/gemini.js"
          test "$(node "$entry" --version)" = "$PACKAGE_VERSION"
          ULTRA_VERIFIED_PACKAGE_SHA="$package_hash" ULTRA_VERIFIED_SOURCE_COMMIT="$PACKAGE_SOURCE" node scripts/verify-ultra-native-analysis.mjs "$entry" "$GITHUB_WORKSPACE/native-analysis.json" "$(command -v r2)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-analysis-${{ matrix.os }}
          path: |
            native-analysis.json
            native-analysis-output.txt
          if-no-files-found: warn
