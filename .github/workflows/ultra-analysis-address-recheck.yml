name: Ultra analysis address same-package recheck

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-address-formats:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Download original Windows archive and verify provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/recheck | Out-Null
          gh run view 43236115019 --repo emstudio010-hub/gemini-ultra-cli --json databaseId,status,conclusion,headSha,jobs,url | Set-Content -Encoding utf8 artifacts/recheck/source-run.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh run download 43236115019 --repo emstudio010-hub/gemini-ultra-cli --name gemini-ultra-cli-windows-latest --dir artifacts/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-analysis-address-recheck.mjs prepare artifacts/package artifacts/recheck/source-run.json artifacts/recheck/package-plan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unchanged installed package with native canonical paths
        shell: pwsh
        run: |
          $plan = Get-Content -Raw -Encoding utf8 artifacts/recheck/package-plan.json | ConvertFrom-Json
          $prefix = Join-Path $env:RUNNER_TEMP 'ultra-address-formats-recheck'
          npm install --prefix $prefix --ignore-scripts --no-audit --no-fund $plan.archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $entry = Join-Path $prefix 'node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-analysis-address-formats.mjs $entry artifacts/recheck/analysis-address-formats-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-analysis-address-recheck.mjs complete artifacts/recheck/package-plan.json artifacts/recheck/analysis-address-formats-verification.json artifacts/recheck/address-formats-recheck-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-ultra-address-formats-recheck-windows
          path: artifacts/recheck/
          if-no-files-found: error
