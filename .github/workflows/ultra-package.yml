          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-record-recovery-verification.json record-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Teamwork draft and milestone delivery
        if: inputs.verification_scope != 'provider' && inputs.verification_scope != 'workflow-reports' && inputs.verification_scope != 'agent-localization' && inputs.verification_scope != 'workflow-resume' && inputs.verification_scope != 'swarm-resume' && inputs.verification_scope != 'workflow-exclusion' && inputs.verification_scope != 'task-claims' && inputs.verification_scope != 'task-lock-locale' && inputs.verification_scope != 'swarm-full-results' && inputs.verification_scope != 'tool-paths' && inputs.verification_scope != 'cockpit-tasks' && inputs.verification_scope != 'search-fallback' && inputs.verification_scope != 'shell-lifecycle' && inputs.verification_scope != 'binary-read-access' && inputs.verification_scope != 'patch-access' && inputs.verification_scope != 'native-preparation' && inputs.verification_scope != 'provider-save-conflict' && inputs.verification_scope != 'native-address-precision' && inputs.verification_scope != 'agent-catalog' && inputs.verification_scope != 'compression-snapshot' && inputs.verification_scope != 'ghidra-runtime' && inputs.verification_scope != 'swarm-redteam' && inputs.verification_scope != 'swarm-result-recovery' && inputs.verification_scope != 'drill-verification' && inputs.verification_scope != 'drill-search'
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-teamwork.mjs $entry artifacts/ultra-release/teamwork-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native provider commands
        if: inputs.verification_scope != 'workflow-reports' && inputs.verification_scope != 'agent-localization' && inputs.verification_scope != 'workflow-resume' && inputs.verification_scope != 'swarm-resume' && inputs.verification_scope != 'workflow-exclusion' && inputs.verification_scope != 'task-claims' && inputs.verification_scope != 'task-lock-locale' && inputs.verification_scope != 'swarm-full-results' && inputs.verification_scope != 'tool-paths' && inputs.verification_scope != 'cockpit-tasks' && inputs.verification_scope != 'search-fallback' && inputs.verification_scope != 'shell-lifecycle' && inputs.verification_scope != 'binary-read-access' && inputs.verification_scope != 'patch-access' && inputs.verification_scope != 'native-preparation' && inputs.verification_scope != 'provider-save-conflict' && inputs.verification_scope != 'native-address-precision' && inputs.verification_scope != 'agent-catalog' && inputs.verification_scope != 'compression-snapshot' && inputs.verification_scope != 'ghidra-runtime' && inputs.verification_scope != 'swarm-redteam' && inputs.verification_scope != 'swarm-result-recovery' && inputs.verification_scope != 'drill-verification' && inputs.verification_scope != 'drill-search'
        shell: pwsh
        run: |
