name: Ultra CLI packages

on:
  push:
    branches: ['codex/ultra-agent-portable']
  workflow_dispatch:
    inputs:
      verification_scope:
        description: 'Use provider only for provider command changes; full runs native collaboration and reverse tool chains.'
        type: choice
        options: [full, provider]
        default: full

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:ultra
      - name: Verify isolated package installation
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/ultra-release/*.tgz | Select-Object -First 1
          $prefix = Join-Path $env:RUNNER_TEMP 'ultra-install'
          npm install --prefix $prefix --ignore-scripts --no-audit --no-fund $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $entry = Join-Path $prefix 'node_modules/gemini-ultra-cli/bundle/gemini.js'
          node $entry --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $entry --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-install.mjs $entry artifacts/ultra-release/install-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native swarm coordination
        if: inputs.verification_scope != 'provider'
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-verification.json models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-model-session-verification.json models-session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-context-verification.json context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/worktree-verification.json worktree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-budget-verification.json budget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-recovery-verification.json recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bounded remote agent discovery
        if: inputs.verification_scope != 'provider'
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-agent-discovery.mjs $entry artifacts/ultra-release/agent-discovery-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native workflow budgets
        if: inputs.verification_scope != 'provider'
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-verification.json models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-model-session-verification.json models-session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-context-verification.json context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-budget-verification.json budget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-recovery-verification.json recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-workflow.mjs $entry artifacts/ultra-release/workflow-record-recovery-verification.json record-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Teamwork draft and milestone delivery
        if: inputs.verification_scope != 'provider'
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-teamwork.mjs $entry artifacts/ultra-release/teamwork-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native provider commands
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-provider.mjs $entry artifacts/ultra-release/provider-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v4
        if: inputs.verification_scope != 'provider'
        with:
          distribution: temurin
          java-version: 21
      - name: Verify installed native Ghidra decompilation
        if: inputs.verification_scope != 'provider'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'ultra-ghidra'
          New-Item -ItemType Directory -Path $toolDirectory | Out-Null
          gh release download Ghidra_12.1.4_build --repo NationalSecurityAgency/ghidra --pattern ghidra_12.1.4_PUBLIC_20260921.zip --dir $toolDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $toolDirectory 'ghidra_12.1.4_PUBLIC_20260921.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db') { throw 'Ghidra release checksum mismatch' }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory }
          else {
            & unzip -q $archive -d $toolDirectory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($IsMacOS) {
            Push-Location (Join-Path $toolDirectory 'ghidra_12.1.4_PUBLIC/support/gradle')
            & ./gradlew :Decompiler:buildNatives --max-workers=2 --no-daemon *> (Join-Path $env:GITHUB_WORKSPACE 'artifacts/ultra-release/decompile-native-build.log')
            $nativeBuildCode = $LASTEXITCODE
            Pop-Location
            if ($nativeBuildCode -ne 0) { exit $nativeBuildCode }
          }
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-decompile.mjs $entry artifacts/ultra-release/decompile-verification.json (Join-Path $toolDirectory 'ghidra_12.1.4_PUBLIC')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-ultra-cli-${{ matrix.os }}
          path: |
            artifacts/ultra-release/*.tgz
            artifacts/ultra-release/*.sha256
            artifacts/ultra-release/install-verification.json
            artifacts/ultra-release/swarm-verification.json
            artifacts/ultra-release/swarm-verification-output.txt
            artifacts/ultra-release/swarm-model-session-verification.json
            artifacts/ultra-release/swarm-model-session-verification-output.txt
            artifacts/ultra-release/swarm-context-verification.json
            artifacts/ultra-release/swarm-context-verification-output.txt
            artifacts/ultra-release/worktree-verification.json
            artifacts/ultra-release/worktree-verification-output.txt
            artifacts/ultra-release/decompile-verification.json
            artifacts/ultra-release/decompile-verification-output.txt
            artifacts/ultra-release/decompile-verification-artifacts/**
            artifacts/ultra-release/decompile-native-build.log
            artifacts/ultra-release/swarm-budget-verification.json
            artifacts/ultra-release/swarm-budget-verification-output.txt
            artifacts/ultra-release/swarm-recovery-verification.json
            artifacts/ultra-release/swarm-recovery-verification-output.txt
            artifacts/ultra-release/agent-discovery-verification.json
            artifacts/ultra-release/agent-discovery-verification-output.txt
            artifacts/ultra-release/workflow-verification.json
            artifacts/ultra-release/workflow-verification-output.txt
            artifacts/ultra-release/workflow-model-session-verification.json
            artifacts/ultra-release/workflow-model-session-verification-output.txt
            artifacts/ultra-release/workflow-context-verification.json
            artifacts/ultra-release/workflow-context-verification-output.txt
            artifacts/ultra-release/workflow-budget-verification.json
            artifacts/ultra-release/workflow-budget-verification-output.txt
            artifacts/ultra-release/workflow-recovery-verification.json
            artifacts/ultra-release/workflow-recovery-verification-output.txt
            artifacts/ultra-release/workflow-record-recovery-verification.json
            artifacts/ultra-release/workflow-record-recovery-verification-output.txt
            artifacts/ultra-release/teamwork-verification.json
            artifacts/ultra-release/teamwork-verification-output.txt
            artifacts/ultra-release/provider-verification.json
            artifacts/ultra-release/provider-verification-output.txt
          if-no-files-found: error
