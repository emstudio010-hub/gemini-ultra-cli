name: Ultra CLI packages

on:
  push:
    branches: ['codex/ultra-agent-portable']
  workflow_dispatch:
    inputs:
      verification_scope:
        description: 'Select the changed capability; full runs native collaboration and reverse tool chains.'
        type: choice
        options:
          [
            full,
            provider,
            workflow-reports,
            agent-localization,
            ghidra-runtime,
            compression-snapshot,
            agent-catalog,
            workflow-resume,
            swarm-resume,
            workflow-exclusion,
            task-claims,
            task-lock-locale,
            swarm-full-results,
            tool-paths,
            cockpit-tasks,
            search-fallback,
            shell-lifecycle,
            binary-read-access,
            patch-access,
            native-preparation,
            provider-save-conflict,
            native-address-precision,
            swarm-redteam,
            swarm-result-recovery,
            drill-verification,
            drill-search,
            native-address-recheck,
            minimum-node,
          ]
        default: full
      package_run_id:
        description: 'Existing package run ID; used only for minimum-node scope'
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    if: inputs.verification_scope != 'minimum-node' && inputs.verification_scope != 'native-address-recheck'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:ultra
      - name: Verify isolated package installation
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/ultra-release/*.tgz | Select-Object -First 1
          $prefix = Join-Path $env:RUNNER_TEMP 'ultra-install'
          npm install --prefix $prefix --ignore-scripts --no-audit --no-fund $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $entry = Join-Path $prefix 'node_modules/gemini-ultra-cli/bundle/gemini.js'
          node $entry --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $entry --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-install.mjs $entry artifacts/ultra-release/install-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native swarm coordination
        if: inputs.verification_scope != 'provider' && inputs.verification_scope != 'workflow-reports' && inputs.verification_scope != 'agent-localization' && inputs.verification_scope != 'workflow-resume' && inputs.verification_scope != 'swarm-resume' && inputs.verification_scope != 'workflow-exclusion' && inputs.verification_scope != 'task-claims' && inputs.verification_scope != 'task-lock-locale' && inputs.verification_scope != 'swarm-full-results' && inputs.verification_scope != 'tool-paths' && inputs.verification_scope != 'cockpit-tasks' && inputs.verification_scope != 'search-fallback' && inputs.verification_scope != 'shell-lifecycle' && inputs.verification_scope != 'binary-read-access' && inputs.verification_scope != 'patch-access' && inputs.verification_scope != 'native-preparation' && inputs.verification_scope != 'provider-save-conflict' && inputs.verification_scope != 'native-address-precision' && inputs.verification_scope != 'agent-catalog' && inputs.verification_scope != 'compression-snapshot' && inputs.verification_scope != 'ghidra-runtime' && inputs.verification_scope != 'swarm-redteam' && inputs.verification_scope != 'swarm-result-recovery' && inputs.verification_scope != 'drill-verification' && inputs.verification_scope != 'drill-search'
        shell: pwsh
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'ultra-install/node_modules/gemini-ultra-cli/bundle/gemini.js'
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-verification.json models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-model-session-verification.json models-session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-context-verification.json context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/worktree-verification.json worktree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-budget-verification.json budget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ultra-swarm.mjs $entry artifacts/ultra-release/swarm-recovery-verification.json recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bounded remote agent discovery
